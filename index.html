<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e8f4f8;
            font-family: 'Times New Roman', Times, serif;
            font-size: 11px;
            color: #4a4a4a;
            padding: 20px;
            line-height: 1.4;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #d4d4d4;
            padding: 15px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .header {
            border-bottom: 1px dotted #bbb;
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-align: right;
        }

        .site-title {
            font-size: 11px;
            font-weight: normal;
            color: #666;
            letter-spacing: 1px;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .left-column {
            padding-right: 10px;
        }

        .right-column {
            border-left: 1px solid #e0e0e0;
            padding-left: 10px;
        }

        .section-title {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            text-transform: lowercase;
        }

        .link-box {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 6px 8px;
            margin-bottom: 6px;
            transition: all 0.2s;
        }

        .link-box:hover {
            background: #fff9e6;
            border-color: #999;
        }

        .link-box a {
            text-decoration: none;
            color: #5a5a5a;
            font-size: 11px;
            display: block;
        }

        .link-box a:hover {
            color: #000;
        }

        .decorative-element {
            margin: 15px 0;
            text-align: center;
            color: #ccc;
            font-size: 11px;
        }

        .footer-note {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dotted #bbb;
            font-size: 11px;
            color: #999;
            text-align: center;
        }

        .timestamp {
            position: absolute;
            top: 5px;
            left: 10px;
            font-size: 9px;
            color: #aaa;
        }

        .mood-status {
            margin: 10px 0;
            padding: 5px;
            background: #f0f0f0;
            border-left: 2px solid #999;
            font-size: 11px;
            color: #666;
        }

        @media (max-width: 480px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }
            
            .right-column {
                border-left: none;
                border-top: 1px solid #e0e0e0;
                padding-left: 0;
                padding-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="timestamp">last updated: 02.16.26</div>
    
    <div class="container">
        <div class="header">
            <div class="site-title">→ links & things</div>
        </div>

        <div class="mood-status">
            current status: online // posting occasionally
        </div>

        <div class="content-wrapper">
            <div class="left-column">
                <div class="section-title">main links:</div>
                
                <div class="link-box">
                    <a href="https://your-portfolio.com">→ portfolio / work</a>
                </div>
                
                <div class="link-box">
                    <a href="https://your-shop.com">→ shop / store</a>
                </div>
                
                <div class="link-box">
                    <a href="https://your-blog.com">→ blog / writing</a>
                </div>
            </div>

            <div class="right-column">
                <div class="section-title">find me:</div>
                
                <div class="link-box">
                    <a href="https://twitter.com/yourhandle">→ twitter/x</a>
                </div>
                
                <div class="link-box">
                    <a href="https://youtube.com/yourchannel">→ youtube</a>
                </div>
                
                <div class="link-box">
                    <a href="/cdn-cgi/l/email-protection#1a63756f685a7f777b737634797577">→ email me</a>
                </div>
            </div>
        </div>

        <div class="decorative-element">
            ⋆｡°✩ ⋆｡°✩ ⋆｡°✩
        </div>

        <div class="footer-note">
            thanks for visiting (◡‿◡✿)
